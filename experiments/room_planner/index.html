<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bedroom Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3-D stage; catalog floats left, item inspector floats right, view controls float bottom-centre. */
:root {
  --stage-a: #ECEAE5; --stage-b: #D9D6CF;          /* stage gradient (warm grey, like the reference renders) */
  --panel: #FAF9F6; --panel-2: #F1EFEA; --line: #DEDAD2;
  --ink: #24272C; --ink-2: #6A6760; --accent: #2F4A7A; --accent-ink: #FFFFFF; --teak: #A8764A;
  --shadow: 0 8px 28px rgba(40, 36, 30, .14), 0 1px 3px rgba(40, 36, 30, .10);
  --ui: "Figtree", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --stage-a: #2A2D33; --stage-b: #17191D; --panel: #23262B; --panel-2: #2B2F35; --line: #3A3E45;
  --ink: #ECEAE5; --ink-2: #A3A09A; --accent: #8FAADB; --accent-ink: #14171C; --teak: #C99467;
  --shadow: 0 8px 28px rgba(0, 0, 0, .45), 0 1px 3px rgba(0, 0, 0, .4); color-scheme: dark } }
:root[data-theme="dark"] {
  --stage-a: #2A2D33; --stage-b: #17191D; --panel: #23262B; --panel-2: #2B2F35; --line: #3A3E45;
  --ink: #ECEAE5; --ink-2: #A3A09A; --accent: #8FAADB; --accent-ink: #14171C; --teak: #C99467;
  --shadow: 0 8px 28px rgba(0, 0, 0, .45), 0 1px 3px rgba(0, 0, 0, .4); color-scheme: dark }
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: radial-gradient(120% 90% at 50% 35%, var(--stage-a), var(--stage-b)); color: var(--ink); font-family: var(--ui); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; touch-action: none; outline: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 0; }
#catalog { top: calc(12px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: 292px; }
#inspector { top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); width: 268px; max-height: calc(100% - 96px); }
.head { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.brand span { font: 500 11px var(--mono); color: var(--ink-2); }
#search { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 9px; font-size: 12px; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
#list { overflow-y: auto; padding: 6px 8px 10px; min-height: 0; flex: 1; }
.cat { font: 600 10.5px var(--ui); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); padding: 12px 6px 6px; display: flex; justify-content: space-between; }
.row { display: grid; grid-template-columns: 44px 1fr auto auto; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 8px; cursor: pointer; }
.row:hover { background: var(--panel-2); }
.row.sel { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.row.off .thumb, .row.off .nm, .row.hid .thumb, .row.hid .nm { opacity: .42; }
.eye { border: 0; background: transparent; color: var(--ink-2); width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; padding: 0; }
.eye:hover { background: var(--panel); color: var(--ink); }
.eye svg { width: 17px; height: 17px; }
.eye[aria-pressed="true"] { color: var(--accent); }
.cat .eye { width: 22px; height: 22px; }
.cat .eye svg { width: 15px; height: 15px; }
.cat > span:last-child { display: flex; align-items: center; gap: 4px; }
#hiddenBar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--ink-2); }
#hiddenBar button { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 12px; padding: 0; }
.thumb { width: 44px; height: 44px; border-radius: 7px; background: var(--panel-2); object-fit: contain; }
.nm { min-width: 0; }
.nm b { display: block; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nm small { font: 11px var(--mono); color: var(--ink-2); }
.rbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; font-size: 12px; padding: 4px 8px; white-space: nowrap; }
.rbtn:hover { border-color: var(--ink-2); }
.foot { border-top: 1px solid var(--line); padding: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; font-weight: 500; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.warn { color: #B4442C; }

#inspector .body { padding: 12px 14px 14px; overflow-y: auto; display: grid; gap: 14px; }
#inspector h2 { margin: 0; font-size: 16px; font-weight: 700; text-wrap: balance; }
.meta { font: 11.5px var(--mono); color: var(--ink-2); }
.sect { display: grid; gap: 8px; }
.sect > label, .lbl { font: 600 10.5px var(--ui); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 0; font-size: 12.5px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.num { display: grid; gap: 3px; }
.num span { font-size: 10.5px; color: var(--ink-2); }
.num input { width: 100%; box-sizing: border-box; padding: 6px 7px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel-2); font: 12.5px var(--mono); font-variant-numeric: tabular-nums; }
.swatches { display: grid; gap: 6px; }
.sw { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; font-size: 12.5px; }
.sw input[type=color] { width: 28px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; }
.sw button { border: 0; background: none; color: var(--ink-2); font-size: 11.5px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.empty { padding: 18px 16px; color: var(--ink-2); font-size: 13px; line-height: 1.5; display: grid; gap: 10px; }
.keys { font: 11.5px var(--mono); color: var(--ink-2); display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; }
.keys kbd { font: inherit; color: var(--ink); }

#viewbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 4px; padding: 5px; flex-direction: row; align-items: center; }
#viewbar button { border: 0; background: transparent; border-radius: 7px; padding: 7px 10px; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
#viewbar button:hover { background: var(--panel-2); }
#viewbar button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
#viewbar .sep { width: 1px; align-self: stretch; background: var(--line); margin: 3px 2px; }
#compass { font: 500 11.5px var(--mono); color: var(--ink-2); padding: 0 8px; min-width: 104px; text-align: center; }

#loading { position: fixed; inset: 0; display: grid; place-items: center; font: 500 13px var(--mono); color: var(--ink-2); pointer-events: none; }
#toast { position: fixed; left: 50%; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.on { opacity: 1; }
#io { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.25); }
#io .panel { position: static; width: min(520px, calc(100% - 32px)); padding: 16px; gap: 10px; }
#io textarea { width: 100%; box-sizing: border-box; height: 180px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); font: 11.5px var(--mono); padding: 8px; }
#mobtabs { display: none; }

@media (max-width: 760px) {
  #catalog, #inspector { left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); width: auto; top: auto; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); max-height: 52%; }
  #catalog:not(.open), #inspector:not(.open) { display: none; }
  #viewbar { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 16px); overflow-x: auto; }
  #viewbar .wide { display: none; }
  #mobtabs { display: flex; position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: max(8px, env(safe-area-inset-left, 0px)); gap: 6px; }
}
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>

<div id="loading">Loading the room…</div>

    <div class="brand"><h1>Bedroom Planner</h1><span id="count">v19</span></div>

  </div>
  <div id="list"></div>

</aside>

<aside id="inspector" class="panel" aria-label="Selected item"><div class="body" id="insp"></div></aside>

<nav id="viewbar" class="panel" aria-label="View">

  <span class="sep"></span>
  <button id="topBtn" class="wide" title="Top-down plan (T)">Plan</button>
  <button id="isoBtn" title="Isometric (I)">Iso</button>

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ---------------------------------------------------------------- constants (room in metres, three.js Y-up; Blender x -> x, Blender y -> -z)
const ROOM = { w: 3.0, d: 2.9, h: 2.7 };
const CENTER = new THREE.Vector3(ROOM.w / 2, 1.0, -ROOM.d / 2);
const WALL_NORMAL = { 1: [0, 0, 1], 2: [0, 0, -1], 3: [-1, 0, 0], 4: [1, 0, 0] };   // inward normals
const WALL_NAME = { 1: 'door wall', 2: 'window wall', 3: 'slat wall', 4: 'wardrobe wall' };
const STORE_KEY = 'bedroomPlanner.v19.layout';
const SNAP = 0.01;                                   // 1 cm moves
const $ = id => document.getElementById(id);

// ---------------------------------------------------------------- renderer, scene, cameras
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const overlay = new THREE.Scene();            // drawn after the outline pass (transform gizmo)
// three-step ramp for the cartoon shading
const TOON_RAMP = new THREE.DataTexture(new Uint8Array([150, 150, 150, 255, 210, 210, 210, 255, 255, 255, 255, 255]), 3, 1);
TOON_RAMP.minFilter = TOON_RAMP.magFilter = THREE.NearestFilter; TOON_RAMP.needsUpdate = true;
const toon = (m) => new THREE.MeshToonMaterial({ name: m.name, color: m.color.clone(), gradientMap: TOON_RAMP, transparent: m.transparent, opacity: m.opacity, side: m.side, alphaTest: m.alphaTest });

const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
const persp = new THREE.PerspectiveCamera(32, 1, 0.05, 100);
let camera = ortho;
const START = { az: Math.PI * 0.25 + Math.PI, pol: 0.98, dist: 14 };

scene.add(new THREE.HemisphereLight(0xffffff, 0xc4bcb0, 1.55));
const sun = new THREE.DirectionalLight(0xfff4e6, 1.9);
sun.position.set(CENTER.x + 3.2, 6.5, CENTER.z + 4.2); sun.target.position.copy(CENTER);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 0.5, far: 20 });
scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight(0xdfe6ff, 0.45); fill.position.set(CENTER.x - 4, 3, CENTER.z - 3); scene.add(fill);

// floor slab under the room (the thick base in the reference renders) + ground shadow catcher
const slab = new THREE.Mesh(new THREE.BoxGeometry(ROOM.w + 0.3, 0.12, ROOM.d + 0.3), new THREE.MeshToonMaterial({ color: 0x3a3c40, gradientMap: TOON_RAMP }));
slab.position.set(ROOM.w / 2, -0.061, -ROOM.d / 2); slab.receiveShadow = true; scene.add(slab);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.16 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.125; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(3.0, 30, 0x2f4a7a, 0x8a8a8a);
grid.position.set(ROOM.w / 2, 0.003, -ROOM.d / 2); grid.material.opacity = 0.35; grid.material.transparent = true; grid.visible = false; scene.add(grid);

let controls = makeControls(camera);
function makeControls(cam) {
  const c = new OrbitControls(cam, renderer.domElement);
  c.target.copy(CENTER); c.enableDamping = true; c.dampingFactor = 0.09;
  c.minPolarAngle = 0.05; c.maxPolarAngle = Math.PI / 2 - 0.04;
  c.minZoom = 0.5; c.maxZoom = 6; c.minDistance = 3; c.maxDistance = 30;
  c.screenSpacePanning = true;
  return c;
}
function placeCamera(az, pol, dist) {
  const p = new THREE.Vector3().setFromSphericalCoords(dist, pol, az).add(controls.target);
  camera.position.copy(p); camera.lookAt(controls.target); controls.update();
}

const tc = new TransformControls(camera, renderer.domElement);
tc.setTranslationSnap(SNAP); tc.setRotationSnap(THREE.MathUtils.degToRad(15)); tc.setSize(0.85);
tc.addEventListener('dragging-changed', e => { controls.enabled = !e.value; if (!e.value) commit('Moved'); });
tc.addEventListener('objectChange', () => { syncInspector(); });
overlay.add(tc);

// ---------------------------------------------------------------- outlines
let outlines = true;
const rtColor = new THREE.WebGLRenderTarget(1, 1, { samples: 4, type: THREE.HalfFloatType });
const rtInfo = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
rtInfo.depthTexture = new THREE.DepthTexture(1, 1); rtInfo.depthTexture.type = THREE.UnsignedIntType;
const infoMat = id => new THREE.ShaderMaterial({
  uniforms: { uId: { value: id } },
  vertexShader: `varying vec3 vN; void main() { vN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform float uId; varying vec3 vN; void main() { vec3 n = normalize(vN); if (!gl_FrontFacing) n = -n; gl_FragColor = vec4(n * 0.5 + 0.5, uId); }`,
  side: THREE.DoubleSide });
const slabInfo = infoMat(4000);
const comp = new THREE.ShaderMaterial({
  uniforms: { tColor: { value: rtColor.texture }, tInfo: { value: rtInfo.texture }, tDepth: { value: rtInfo.depthTexture },
              texel: { value: new THREE.Vector2() }, thick: { value: 1 }, isOrtho: { value: true }, near: { value: 0.1 }, far: { value: 100 },
              selId: { value: -1 }, ink: { value: new THREE.Color(0x221e1b) }, selInk: { value: new THREE.Color(0x2f6bff) } },
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    #include <packing>
    uniform sampler2D tColor, tInfo, tDepth; uniform vec2 texel; uniform float thick, near, far, selId; uniform bool isOrtho; uniform vec3 ink, selInk;
    varying vec2 vUv;
    float vz(vec2 uv) { float d = texture2D(tDepth, uv).x; return isOrtho ? orthographicDepthToViewZ(d, near, far) : perspectiveDepthToViewZ(d, near, far); }
    void main() {
      vec4 c = texture2D(tColor, vUv);
      vec4 i0 = texture2D(tInfo, vUv); float z0 = vz(vUv);
      float e = 0.0, sel = 0.0;
      vec2 offs[4]; offs[0] = vec2(thick, 0.0); offs[1] = vec2(-thick, 0.0); offs[2] = vec2(0.0, thick); offs[3] = vec2(0.0, -thick);
      for (int k = 0; k < 4; k++) {
        vec2 uv = vUv + offs[k] * texel;
        vec4 i1 = texture2D(tInfo, uv); float z1 = vz(uv);
        bool other = abs(i1.a - i0.a) > 0.5;
        if (other) { e = 1.0; if (abs(i0.a - selId) < 0.5 || abs(i1.a - selId) < 0.5) sel = 1.0; }
        else if (i0.a > 0.5) {
          if (abs(z1 - z0) > 0.035 + 0.01 * abs(z0)) e = max(e, 0.9);                         // fold / overlap inside one object
          if (dot(i0.xyz * 2.0 - 1.0, i1.xyz * 2.0 - 1.0) < 0.72) e = max(e, 0.55);           // crease
        }
      }
      vec3 line = mix(ink, selInk, sel);
      float a = e * (sel > 0.5 ? 1.0 : 0.82);
      gl_FragColor = vec4(c.rgb * (1.0 - a) + line * a, c.a * (1.0 - a) + a);
      #include <colorspace_fragment>
    }`,
  depthTest: false, depthWrite: false });
const quadScene = new THREE.Scene(), quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
quadScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), comp));
const _hidden = [];
function renderFrame() {
  if (!outlines) { renderer.setRenderTarget(null); renderer.render(scene, camera); }
  else {
    renderer.setRenderTarget(rtColor); renderer.clear(); renderer.render(scene, camera);
    // id/normal pass: every visible, solid object gets its own id
    for (const it of items.values()) {
      if (!it.node.visible) continue;
      if (it.ghost) { it.node.visible = false; _hidden.push(it.node); continue; }
      it.node.traverse(o => { if (o.isMesh) { o.userData._m = o.material; o.material = it.info; } });
    }
    const keep = slab.material; slab.material = slabInfo; ground.visible = false; const gv = grid.visible; grid.visible = false;
    const bg = renderer.getClearAlpha(); renderer.setClearColor(0x8080ff, 0);
    renderer.shadowMap.autoUpdate = false;
    renderer.setRenderTarget(rtInfo); renderer.clear(); renderer.render(scene, camera);
    renderer.shadowMap.autoUpdate = true; renderer.setClearColor(0x000000, bg);
    slab.material = keep; ground.visible = true; grid.visible = gv;
    for (const it of items.values()) it.node.traverse(o => { if (o.isMesh && o.userData._m) { o.material = o.userData._m; delete o.userData._m; } });
    while (_hidden.length) _hidden.pop().visible = true;
    Object.assign(comp.uniforms.isOrtho, { value: camera.isOrthographicCamera }); comp.uniforms.near.value = camera.near; comp.uniforms.far.value = camera.far;
    comp.uniforms.selId.value = selected ? selected.idNum : -1;
    renderer.setRenderTarget(null); renderer.render(quadScene, quadCam);
  }
  renderer.autoClear = false; renderer.clearDepth(); renderer.render(overlay, camera); renderer.autoClear = true;
}

function resize() {
  const w = innerWidth, h = innerHeight, a = w / h, s = a < 1 ? 2.5 / a : 3.3;
  renderer.setSize(w, h);
  Object.assign(ortho, { left: -s * a, right: s * a, top: s, bottom: -s }); ortho.updateProjectionMatrix();

    const it = registerItem(node, { id: c.id, dupOf: c.of }); it.mats.forEach((m, i) => m.orig = src.mats[i]?.orig ?? m.orig);
    applyState(it, { p: c.p, r: c.r, v: c.v, c: c.c }); makeThumb(it);
  }
  if (selected && !items.has(selected.id)) selected = null;
}
function commit(msg) {
  const s = snapshot();
  if (history[hpos] === s) { renderList(); return; }
  history = history.slice(0, hpos + 1); history.push(s); hpos = history.length - 1; if (history.length > 200) { history.shift(); hpos--; }
  try { localStorage.setItem(STORE_KEY, s); } catch (e) {}
  classifyAll(); if (msg) toast(msg);
  renderList(); syncInspector();
}
function undo(dir) {
  const n = hpos + dir; if (n < 0 || n >= history.length) return toast(dir < 0 ? 'Nothing to undo' : 'Nothing to redo');
  hpos = n; restore(history[hpos]); classifyAll();
  try { localStorage.setItem(STORE_KEY, history[hpos]); } catch (e) {}
  for (const it of items.values()) refreshThumbSoon(it);
  select(selected && items.has(selected.id) ? selected : null, false); toast(dir < 0 ? 'Undone' : 'Redone');
}
$('undo').onclick = () => undo(-1); $('redo').onclick = () => undo(1);
let resetArm = 0;
$('resetBtn').onclick = () => {
  if (Date.now() - resetArm > 3000) { resetArm = Date.now(); $('resetBtn').textContent = 'Click again to reset'; setTimeout(() => $('resetBtn').textContent = 'Reset room', 3000); return; }
  restore(JSON.stringify({ v: 1, items: {}, copies: [] })); for (const it of items.values()) refreshThumbSoon(it);
  $('resetBtn').textContent = 'Reset room'; commit('Room reset to the v19 layout'); select(null);
};
$('exportBtn').onclick = async () => {
  const s = snapshot();
  try { await navigator.clipboard.writeText(s); toast('Layout copied to the clipboard'); }
  catch (e) { openIO('Copy this layout', s, false); }
};
$('importBtn').onclick = () => openIO('Paste a layout you copied earlier', '', true);
function openIO(title, text, canApply) {
  $('io').hidden = false; $('ioTitle').textContent = title; $('ioText').value = text; $('ioOk').hidden = !canApply;
  $('ioText').focus(); if (text) $('ioText').select();
}
$('ioClose').onclick = () => $('io').hidden = true;
$('ioOk').onclick = () => {
  try { restore($('ioText').value); for (const it of items.values()) refreshThumbSoon(it); $('io').hidden = true; commit('Layout loaded'); select(null); }
  catch (e) { toast('That text is not a layout. Copy it again with “Copy layout”.'); }
};
let toastT = 0;
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1600); }

// ---------------------------------------------------------------- view controls
let anim = null;
function animateTo(az, pol, zoom) {
  const sp = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
  let daz = az - sp.theta; daz = Math.atan2(Math.sin(daz), Math.cos(daz));
  anim = { t0: performance.now(), dur: matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 520, az0: sp.theta, daz, pol0: sp.phi, pol1: pol ?? sp.phi, r: sp.radius, z0: camera.zoom, z1: zoom ?? camera.zoom };
}
function stepAnim(now) {
  if (!anim) return;
  const k = Math.min(1, (now - anim.t0) / anim.dur), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  const p = new THREE.Vector3().setFromSphericalCoords(anim.r, anim.pol0 + (anim.pol1 - anim.pol0) * e, anim.az0 + anim.daz * e).add(controls.target);
  camera.position.copy(p); camera.zoom = anim.z0 + (anim.z1 - anim.z0) * e; camera.updateProjectionMatrix(); camera.lookAt(controls.target);
  if (k >= 1) anim = null;
}
const curAz = () => new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target)).theta;
const snapAz = a => Math.round((a - Math.PI / 4) / (Math.PI / 2)) * (Math.PI / 2) + Math.PI / 4;
$('rotL').onclick = () => animateTo(snapAz(curAz()) - Math.PI / 2, Math.max(controls.getPolarAngle(), 0.6));
$('rotR').onclick = () => animateTo(snapAz(curAz()) + Math.PI / 2, Math.max(controls.getPolarAngle(), 0.6));
$('topBtn').onclick = () => animateTo(snapAz(curAz()) - Math.PI / 4, 0.06);
$('isoBtn').onclick = () => { controls.target.copy(CENTER); animateTo(snapAz(curAz()), START.pol, 1); };
$('perspBtn').onclick = () => {
  const usePersp = camera === ortho, from = camera;
  camera = usePersp ? persp : ortho;
  const dir = from.position.clone().sub(controls.target).normalize();
  camera.position.copy(controls.target).addScaledVector(dir, usePersp ? 11 / Math.max(from.zoom, 0.4) : START.dist);
  const t = controls.target.clone(); controls.dispose(); controls = makeControls(camera); controls.target.copy(t); controls.update();
  tc.camera = camera; $('perspBtn').setAttribute('aria-pressed', usePersp);
};
const toggle = (id, get, set) => $(id).onclick = () => { set(!get()); $(id).setAttribute('aria-pressed', get()); };
toggle('cutBtn', () => cutaway, v => cutaway = v);
toggle('ceilBtn', () => showCeiling, v => showCeiling = v);
toggle('gridBtn', () => grid.visible, v => grid.visible = v);
toggle('lineBtn', () => outlines, v => outlines = v);
$('tabCat').onclick = () => { $('catalog').classList.toggle('open'); $('inspector').classList.remove('open'); };
$('tabItem').onclick = () => { $('inspector').classList.toggle('open'); $('catalog').classList.remove('open'); };

addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  const k = e.key.toLowerCase(), mod = e.metaKey || e.ctrlKey;
  if (mod && k === 'z') { e.preventDefault(); undo(e.shiftKey ? 1 : -1); return; }
  if (k === 'a' && !mod) return $('rotL').click();
  if (k === 'd' && !mod) return $('rotR').click();
  if (k === 't') return $('topBtn').click();
  if (k === 'i') return $('isoBtn').click();
  if (k === 'escape') return select(null);
  if (k === 'h' && selected) return setHidden([selected], !selected.hidden);
  const it = selected; if (!it || !it.visible || it.hidden) return;
  const st = e.shiftKey ? 0.1 : 0.01, n = it.node;
  const moves = { arrowleft: [-st, 0], arrowright: [st, 0], arrowup: [0, -st], arrowdown: [0, st] };
  if (moves[k]) {   // nudge relative to the screen, not the world
    e.preventDefault(); const f = new THREE.Vector3(); camera.getWorldDirection(f); f.y = 0; f.normalize(); const r = new THREE.Vector3(-f.z, 0, f.x);
    const [dx, dz] = moves[k]; const v = r.multiplyScalar(dx).add(f.multiplyScalar(-dz));
    if (Math.abs(v.x) > Math.abs(v.z)) n.position.x += Math.sign(v.x) * st; else n.position.z += Math.sign(v.z) * st;
    return commit();
  }
  if (k === 'w') { n.position.y += st; return commit(); }
  if (k === 's') { n.position.y = Math.max(0, n.position.y - st); return commit(); }
  if (k === 'q') { n.rotation.y += Math.PI / 12; return commit(); }
  if (k === 'e') { n.rotation.y -= Math.PI / 12; return commit(); }
  if (k === 'delete' || k === 'backspace') { e.preventDefault(); return setInRoom(it, false); }
  if (mod && k === 'd') { e.preventDefault(); return duplicate(it); }
  if (k === 'g') return setMode('move'); if (k === 'r') return setMode('rotate'); if (k === 'l') return setMode('lift');
});

// ---------------------------------------------------------------- load
const loader = new GLTFLoader();
// the model ships as base64 text (room.glb.txt) because artifact hosting serves text but not .glb
fetch('room.glb.txt').then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }).then(b64 => {
  const bin = atob(b64.trim()), buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  loader.parse(buf.buffer, '', onModel, onFail);
}).catch(onFail);
function onModel(gltf) {
  const nodes = [...gltf.scene.children];
  for (const n of nodes) registerItem(n);
  for (const it of items.values()) { it.stored = !!it.node.userData.stored; }
  let saved = null; try { saved = localStorage.getItem(STORE_KEY); } catch (e) {}
  if (saved) { try { restore(saved); } catch (e) { saved = null; } }
  classifyAll();
  history = [snapshot()]; hpos = 0;
  renderChips(); renderList(); renderInspector();
  $('loading').hidden = true;
  if (saved) toast('Your last layout was restored');
  // thumbnails in small batches so the page stays responsive
  const all = [...items.values()]; let i = 0;
  (function batch() { const end = Math.min(all.length, i + 6); for (; i < end; i++) makeThumb(all[i]); renderList(); if (i < all.length) setTimeout(batch, 16); })();
}
function onFail(err) { $('loading').textContent = 'The room model could not be loaded. Reload the page to try again.'; console.error(err); }

placeCamera(START.az, START.pol, START.dist); ortho.zoom = 1; ortho.updateProjectionMatrix();
renderer.setAnimationLoop(now => {
  stepAnim(now); if (!anim) controls.update();
  updateVisibility();
  renderFrame();
});
</script>
